; Windows ビルド専用のレンダリング設定オーバーライド（Quest/Android ビルドには影響しない）
; Turing クラス GPU（RTX 2070 Super 等）での起動クラッシュ対策として、
; PC パッケージで実態として有効化される重い機能を無効化する

[/Script/Engine.RendererSettings]
; レイトレーシング無効（DX12+SM6+Turing ドライバのクラッシュ候補）
r.RayTracing=False

; Virtual Shadow Maps 無効（従来のシャドウマップへフォールバック）
r.Shadow.Virtual.Enable=0

; Lumen GI / Lumen 反射無効（Forward Shading 下では元々無効だが明示的に切る）
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0

; メッシュ距離場生成無効（Lumen 専用データ。VRAM とロード時間の節約）
r.GenerateMeshDistanceFields=False
