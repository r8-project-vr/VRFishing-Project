; ===========================================
; パッケージング: 実行時ソフト参照資産の強制 cook
; ===========================================
; TSoftClassPtr / TSoftObjectPtr / 実行時 LoadObject による参照は cook 依存にならず、
; 他資産からのハード参照経路が無いとパッケージに含まれない（エディタ PIE では正常に見えるので発見が遅れる）。
; - /Game/Blueprints           : BP_FishingRod（FishingRodVisualizerComponent::SpawnRodActor が LoadSynchronous）
; - Engine/Content/BasicShapes : Cylinder（FishingLineComponent の既定糸メッシュ、実行時 LoadObject）
; - /Game/TestSFX              : 効果音 11 スロット（FishingAudioSettings の TSoftObjectPtr）
[Packaging]
+DirectoriesToAlwaysCook=(Path="/Game/Blueprints")
+DirectoriesToAlwaysCook=(Path="Engine/Content/BasicShapes")
+DirectoriesToAlwaysCook=(Path="/Game/TestSFX")

